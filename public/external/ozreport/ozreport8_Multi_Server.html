    <script language="JavaScript">
      // 2024.02.07 박용훈 특정 리포트경우 1회만 프린트를 할수 있어야 해서
      // 프린트 버튼 클릭 후 정상출력 여부 이벤트 추가
      // code 0=정상출력, 1=정상출력 아님
      function OZPrintCommand_OZViewer(
        msg,
        code,
        reportname,
        printername,
        printcopy,
        printpages,
        printrange,
        username,
        printerdrivername,
        printpagesrange
      ) {
        window.parent.postMessage(
          // 전달할 data (부모창에서 호출할 함수명)
          { functionName: "print", params: [code] },
          // 부모창의 도메인
          // , 'http://abc.com'
          // 모든 도메인에 대하여 허용 ( 추천하지 않음 )
          "*"
        )
      }
    </script>
  </head>
  <body style="width: 98%; height: 98%">
    <div
      id="OZViewer"
      style="width: 98%; height: 98%; overflow-y: scroll"
    ></div>
    <script type="text/javascript">
      var reportName = []
      var argsList = []

      let list = []
      let cnt = -1
      function SetOZParamters_OZViewer() {
        var oz = document.getElementById("OZViewer")
        oz.sendToActionScript(
          "connection.servlet",
          "https://ozrptin8.hhi.co.kr/oz/server"
        )

        // 멀티 세팅
        oz.sendToActionScript("viewer.childcount", list.length - 1)
        oz.sendToActionScript("viewer.focus_doc_index", "0") // 처음 보여지는 보고서 번호(0부터 시작)
        oz.sendToActionScript("viewer.showtree", "true") // 트리창 표시
        oz.sendToActionScript("print.alldocument", "true") // 멀티 보고서 한번에 인쇄
        oz.sendToActionScript("global.concatpage", "true") // 페이지 연달아 나오게 하려면 true
        oz.sendToActionScript("global.inheritparameter", "true") // 첫번째 보고서의 파라미터 값을 상속 받음

        // 공통세팅
        oz.sendToActionScript("comment.all", "true") //주석 사용
        oz.sendToActionScript("pdf.savecomment", "true") //주석 저장 사용
        oz.sendToActionScript("comment.highlightpen", "true") //형광펜 사용
        oz.sendToActionScript("information.debug", "true")

        // OZ Viewer 환경설정 [선택]
        oz.sendToActionScript("viewer.configmode", "html")
        oz.sendToActionScript("viewer.framewidth", "880")
        oz.sendToActionScript("viewer.frameheight", "700")
        oz.sendToActionScript("global.language", "ko/KR")
        oz.sendToActionScript("print.size", "A4")
        oz.sendToActionScript("viewer.progresscommand", "true") // 보고서 생성 단계별로 발생하는 이벤트 사용여부

        let cnt = 0 // cnt 변수 초기화
        console.log(list, "list")
        for (let item of list) {
          if (cnt == 0) {
            oz.sendToActionScript("connection.reportname", item.reportName)
            oz.sendToActionScript("information.debug", "true")
            oz.sendToActionScript("connection.pcount", item.args.length)
            oz.sendToActionScript("global.language", "ko/KR")

            let subcnt = 0
            for (let subitem of item.args) {
              oz.sendToActionScript("connection.args" + (subcnt + 1), subitem)

              subcnt++
            }
          } else {
            oz.sendToActionScript(
              `child${cnt}.connection.reportname`,
              item.reportName
            ) // n번쨰
            oz.sendToActionScript(
              `child${cnt}.connection.pcount`,
              item.args.length
            )
            let subcnt = 0
            for (let subitem of item.args) {
              oz.sendToActionScript(
                `child${cnt}.connection.args` + (subcnt + 1),
                subitem
              )

              subcnt++
            }
          }

          cnt++ // cnt 증가
        }

        // 멀티보고서 공통 패러미터 설정
        // argsList 처리 예시:
        // for (var i = 1; i <= argsList.length; i++) {
        //   oz.sendToActionScript("connection.args" + i, argsList[i - 1])
        // }

        // 특정 리포트 경우 1회만 프린트를 할 수 있게 설정
        // if ("/manage/hse/EDUBA0030.ozr" == reportName) {
        //   oz.sendToActionScript("viewer.printcommand", "true")
        // }

        console.log(oz, "oz")

        // 추가 파라미터 설정 예시
        // oz.sendToActionScript("connection.pcount","2");
        // oz.sendToActionScript("connection.args1","P_WO_UNO=124106");
        // oz.sendToActionScript("connection.args2","P_LANG_CD=02");
        // oz.sendToActionScript("connection.args3","v_QUERYUSER=11219");

        // return true
      }
      async function setParameter(data) {
        // data.reportName == []
        // data.args == []

        // reportName = data.reportName
        // argsList = data.args
        for (let i of data) {
          list.push(i)
        }
        console.log(list)
        // console.log(data, "list")
        // reportName = data.reportName
        // argsList = data.args
        await start_ozjs("OZViewer", "https://ozrptin8.hhi.co.kr/oz/ozhviewer/")
      }

      // console.log('# [ozreport8.html] start_ozjs()')
      // }

      // console.log('# [ozreport8.html] setParameter() end')
    </script>
